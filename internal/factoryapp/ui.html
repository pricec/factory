<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>factory</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px;
    padding: 14px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-family: var(--mono); }
  header h1 .prompt { color: var(--accent); }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button { background: none; border: 1px solid transparent; color: var(--dim);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  nav button.active { color: var(--text); border-color: var(--border); background: var(--panel); }
  nav button:hover { color: var(--text); }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--dim); font-size: 12px; }
  .toolbar .count { font-family: var(--mono); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 13px; }
  th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #1c2128; }
  tr.selected { background: #1f2937; outline: 1px solid var(--accent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.online { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.offline { background: var(--bad); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
    border: 1px solid var(--border); color: var(--dim); }
  .badge.hot { color: var(--warn); border-color: var(--warn); }
  #detail { margin-top: 16px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; }
  #detail h2 { margin: 0 0 4px; font-size: 14px; font-family: var(--mono); }
  #detail .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  #detail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--dim); margin: 16px 0 6px; }
  pre { background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; overflow: auto; font-family: var(--mono); font-size: 12px; margin: 0; }
  .msg { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    margin-bottom: 6px; font-family: var(--mono); font-size: 12px; }
  .msg .meta { color: var(--dim); margin-bottom: 4px; }
  .msg .type { color: var(--accent); }
  .empty { color: var(--dim); font-style: italic; padding: 16px; text-align: center; }
  a { color: var(--accent); text-decoration: none; }
  .actions { margin-top: 14px; }
  .actions button { background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
  .actions button:hover { border-color: var(--accent); }
  .err { color: var(--bad); font-family: var(--mono); font-size: 12px; padding: 12px; }

  /* chat */
  main.wide { max-width: none; }
  #inbox3 { display: grid; grid-template-columns: 280px minmax(0, 1fr) 300px; gap: 14px;
    height: calc(100vh - 110px); }
  #inbox3.tp-collapsed { grid-template-columns: 280px minmax(0, 1fr) 44px; }
  #inbox3.tp-collapsed #taskpane > :not(.tp-head):not(#rail-badge) { display: none; }
  #inbox3.tp-collapsed #taskpane { padding: 10px 4px; align-items: center; }
  #inbox3.tp-collapsed .tp-head { flex-direction: column; }
  #inbox3.tp-collapsed .tp-head h2 { writing-mode: vertical-rl; margin: 8px 0 0; }
  .tp-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .tp-head h2 { margin: 0 0 8px; }
  .iconbtn { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 5px;
    padding: 1px 8px; cursor: pointer; font: 12px var(--mono); min-width: 26px; }
  .iconbtn:hover { border-color: var(--accent); }
  .iconbtn:disabled { opacity: .4; cursor: default; }
  #rail-badge { display: none; }
  #inbox3.tp-collapsed #rail-badge { display: block; writing-mode: vertical-rl; margin-top: 10px; color: var(--warn); font: 700 11px var(--mono); }
  #focusbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 4px 8px; font-size: 12px; }
  #focusbar .waiting { font: 700 12px var(--mono); color: var(--warn); }
  #focusbar .spacer { flex: 1; }
  #modetoggle.on { border-color: var(--accent); color: var(--accent); }
  #kbhelp { color: var(--dim); font: 11px var(--mono); padding: 4px; }
  kbd { background: var(--bg); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
    padding: 0 5px; font: 11px var(--mono); color: var(--text); }
  .task .needs { color: var(--warn); font: 700 10px var(--mono); margin-left: 6px; }
  #focus-empty { text-align: center; padding: 60px 16px; }
  #focus-empty .big { font-size: 20px; color: var(--ok); margin-bottom: 6px; font-style: normal; }
  @media (max-width: 900px) { #inbox3 { grid-template-columns: 1fr; height: auto; } #chat { height: 60vh; } }
  .pane { display: flex; flex-direction: column; min-height: 0; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  #centerpane { background: none; border: none; padding: 0; }
  .pane h2 { margin: 0 0 8px; font: 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  #alerts, #tasklist { overflow-y: auto; flex: 1; }
  .prio { display: inline-block; font: 700 10px var(--mono); padding: 1px 6px; border-radius: 8px;
    border: 1px solid var(--border); color: var(--dim); }
  .prio.p0 { color: #fff; background: var(--bad); border-color: var(--bad); }
  .prio.p1 { color: var(--bad); border-color: var(--bad); }
  .prio.p2 { color: var(--warn); border-color: var(--warn); }
  .alert, .task { border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; margin-bottom: 7px; background: var(--bg); }
  .task { cursor: pointer; } .task:hover { border-color: var(--accent); }
  .task.selected { outline: 1px solid var(--accent); } .task.closed { opacity: .6; }
  .atitle, .ttitle { font-weight: 600; word-break: break-word; }
  .abody, .tprev { color: var(--dim); font-size: 12px; margin-top: 3px; word-break: break-word; }
  .ameta, .tmeta { color: var(--dim); font: 10.5px var(--mono); margin-top: 3px; }
  .aactions { margin-top: 5px; display: flex; gap: 6px; }
  .aactions button, .areply button, #newtaskform button { background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 5px; padding: 2px 9px; cursor: pointer; font: 12px inherit; }
  .areply { gap: 6px; margin-top: 6px; }
  .areply textarea { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 6px; font: 12px inherit; resize: vertical; }
  .tasktools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .tasktools input[type=search] { background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font: 12px var(--mono); }
  .toggle { color: var(--dim); font-size: 12px; cursor: pointer; }
  #newtaskform { display: flex; gap: 8px; margin-bottom: 8px; }
  #newtaskform textarea { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font: 13.5px/1.4 inherit; resize: none; min-height: 40px; }
  #newtaskform button { background: #1f6feb; border-color: #1f6feb; color: #fff; padding: 0 14px; border-radius: 8px; }
  #threadhead { align-items: center; justify-content: space-between; gap: 10px; padding: 6px 4px;
    border-bottom: 1px solid var(--border); font-weight: 600; }
  #thread-title { display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
  #thread-title .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text;
    border-radius: 4px; padding: 1px 3px; }
  #thread-title .ttl:hover, #thread-title .ttl:focus-visible { background: var(--panel); outline: 1px solid var(--border); }
  #thread-title .editbtn { background: none; border: 1px solid transparent; color: var(--dim); cursor: pointer;
    padding: 0 4px; border-radius: 4px; font-size: 13px; }
  #thread-title .editbtn:hover, #thread-title .editbtn:focus-visible { color: var(--text); border-color: var(--border); }
  #thread-title input.titleedit { flex: 1; min-width: 0; background: var(--panel); color: var(--text);
    border: 1px solid #1f6feb; border-radius: 4px; padding: 2px 6px; font: inherit; }
  #thread-title .titleerr { color: #f85149; font-weight: 400; font-size: 12px; }
  .internal { opacity: .65; border-left: 2px dashed var(--border); padding-left: 6px; }
  #chat { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #chatlog { flex: 1; overflow-y: auto; padding: 8px 4px; display: flex;
    flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .bubble { max-width: 76%; padding: 9px 13px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel); white-space: pre-wrap;
    word-break: break-word; font: 13.5px/1.45 inherit; }
  .bubble .who { display: block; font: 10.5px var(--mono); color: var(--dim);
    letter-spacing: .04em; margin-bottom: 3px; text-transform: uppercase; }
  .bubble.human { align-self: flex-end; background: #1f2937; border-color: #2d4a6b; }
  .bubble.brain { align-self: flex-start; border-color: #2b5a2b; }
  .bubble.notify { align-self: stretch; max-width: 100%; background: #1a1d22;
    font-family: var(--mono); font-size: 12px; }
  .bubble.notify .state { font-weight: 700; }
  .bubble.notify .st-done { color: var(--ok); } .bubble.notify .st-failed,
  .bubble.notify .st-timed_out, .bubble.notify .st-dead, .bubble.notify .st-cancelled,
  .bubble.notify .st-superseded { color: var(--bad); }
  /* markdown-rendered bubble bodies (renderMarkdown) */
  .bubble .md { white-space: normal; }
  .bubble .md p { margin: 0 0 8px; } .bubble .md p:last-child { margin: 0; }
  .bubble .md h1, .bubble .md h2, .bubble .md h3 { margin: 10px 0 4px; font-size: 1em; line-height: 1.3; }
  .bubble .md h1 { font-size: 1.15em; } .bubble .md h2 { font-size: 1.08em; }
  .bubble .md ul, .bubble .md ol { margin: 4px 0 8px; padding-left: 20px; }
  .bubble .md li { margin: 2px 0; }
  .bubble .md code { background: #0d1117; border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font: 12px var(--mono); }
  .bubble .md pre { margin: 6px 0; padding: 8px 10px; }
  .bubble .md pre code { border: none; padding: 0; background: none; }
  .bubble .md a { text-decoration: underline; }
  #chatform { display: flex; gap: 8px; padding-top: 10px; }
  #chatform textarea { flex: 1; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font: 13.5px/1.4 inherit; resize: none; min-height: 44px; max-height: 140px; }
  #chatform textarea:focus { outline: 1px solid var(--accent); }
  #chatform button { background: #1f6feb; border: 1px solid #1f6feb; color: #fff;
    border-radius: 8px; padding: 0 18px; cursor: pointer; font: inherit; }
  #chatform button:disabled { opacity: .5; cursor: wait; }
  .typing { align-self: flex-start; color: var(--dim); font: 11px var(--mono);
    padding: 2px 8px; }
  form.panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  form.panel label { display: block; color: var(--dim); font-size: 11px;
    text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 4px; }
  form.panel input, form.panel textarea, form.panel select { width: 100%;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font: 13px var(--mono); }
  form.panel textarea { min-height: 60px; resize: vertical; }
  form.panel .row { display: flex; gap: 10px; }
  form.panel .row > div { flex: 1; }
  form.panel button[type=submit] { margin-top: 12px; background: #1f6feb;
    border: 1px solid #1f6feb; color: #fff; border-radius: 6px; padding: 6px 14px;
    cursor: pointer; font: inherit; }
  .result-note { color: var(--ok); font-family: var(--mono); font-size: 12px; margin: 8px 2px; }
  #usagepanel { max-width: 1100px; margin: 12px auto 0; padding: 10px 20px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; font-size: 12px; }
  #usagepanel .uhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--dim); font-family: var(--mono); }
  #usagepanel .uhead b { color: var(--text); text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
  #usagepanel .uwins { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 8px; }
  #usagepanel .uwin { flex: 1; min-width: 260px; }
  #usagepanel .uwin.stale { opacity: .55; }
  #usagepanel .urow { display: flex; align-items: center; gap: 8px; font-family: var(--mono); }
  #usagepanel .meter { flex: 1; height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  #usagepanel .meter > i { display: block; height: 100%; background: var(--dim); }
  #usagepanel .meter > i.GREEN { background: var(--ok); }
  #usagepanel .meter > i.YELLOW, #usagepanel .meter > i.ORANGE { background: var(--warn); }
  #usagepanel .meter > i.RED { background: var(--bad); }
  #usagepanel .udetail { color: var(--dim); font-family: var(--mono); margin-top: 2px; }
  #usagepanel .badge.GREEN { color: var(--ok); border-color: var(--ok); }
  #usagepanel .badge.YELLOW, #usagepanel .badge.ORANGE { color: var(--warn); border-color: var(--warn); }
  #usagepanel .badge.RED { color: var(--bad); border-color: var(--bad); }
  #usagepanel .badge.ORANGE { background: rgba(210,153,34,.18); }
  #usagepanel .badge.RED { background: rgba(248,81,73,.18); }
  #usagepanel .unote { color: var(--bad); }
  #usagepanel .badge.PAUSED { color: #fff; border-color: var(--bad); background: var(--bad); font-weight: bold; }
  #usagepanel .badge.OFF { color: var(--warn); border-color: var(--warn); background: rgba(210,153,34,.18); }
  #usagepanel .badge.AUTO { color: var(--ok); border-color: var(--ok); }
  #usagepanel.unavail > :not(.uhead) { opacity: .5; }
  #usagepanel .upause { margin: 8px 0 0; padding: 10px 12px; border: 2px solid var(--bad); border-radius: 6px;
    background: rgba(248,81,73,.16); color: var(--text); font-family: var(--mono); font-size: 14px; font-weight: bold; }
  #usagepanel .upause .upreason { display: block; margin-top: 4px; font-size: 12px; font-weight: normal; color: var(--dim); }
  #usagepanel .ugate { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-family: var(--mono); color: var(--dim); }
  #usagepanel .ufail { color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 5px; }
  #usagepanel .uctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-family: var(--mono); color: var(--dim); }
  #usagepanel .uctl button { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 8px; cursor: pointer; font: inherit; }
  #usagepanel .uctl button:disabled { opacity: .4; cursor: not-allowed; }
  #usagepanel .uctl button.uoff:hover:not(:disabled) { border-color: var(--warn); }
  #usagepanel .uctl .uerr { color: var(--bad); }
  #usagepanel .usec { margin-top: 8px; font-family: var(--mono); color: var(--dim); }
  #usagepanel .usec table { width: 100%; border-collapse: collapse; margin-top: 2px; }
  #usagepanel .usec td { padding: 2px 6px; border-top: 1px solid var(--border); color: var(--text); }
  #usagepanel .usec tr.uheldrow { cursor: pointer; }
  #usagepanel .usec tr.uheldrow:hover { background: var(--bg); }
  #usagepanel .ualert { padding: 2px 0; color: var(--text); }
  #usagepanel .ualert .ucrit { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1><span class="prompt">factory</span> : <span id="adv">-</span></h1>
  <nav>
    <button id="tab-chat" class="active">Tasks</button>
    <button id="tab-foremen">Foremen</button>
    <button id="tab-jobs">Jobs</button>
    <button id="tab-inboxes">Inboxes</button>
  </nav>
</header>
<section id="usagepanel" aria-label="Factory usage">
  <div class="uhead"><b>Factory usage</b> <span id="u-overall"></span> <span id="u-meta"></span> <span id="u-note" class="unote"></span></div>
  <div class="upause" id="u-pause" role="alert" style="display:none"></div>
  <div class="uwins" id="u-wins"></div>
  <div class="udetail" id="u-spend"></div>
  <div class="ugate" id="u-gate"></div>
  <div class="uctl" id="u-ctl"></div>
  <div class="usec" id="u-held"></div>
  <div class="usec" id="u-alerts"></div>
</section>
<main>
  <div id="chatview">
    <div id="inbox3">
      <section id="alertpane" class="pane">
        <h2>alerts <span id="alert-count" class="badge"></span></h2>
        <div id="alerts"></div>
      </section>
      <section id="centerpane" class="pane">
        <form id="newtaskform">
          <textarea id="newtask-input" placeholder="new task — tell the factory what you need…" rows="1"></textarea>
          <button type="submit" id="newtask-send">new task</button>
        </form>
        <div id="focusbar">
          <button type="button" id="modetoggle" class="iconbtn" title="toggle focus / list view (l)"></button>
          <span class="waiting" id="waiting-count"></span>
          <span class="spacer"></span>
          <span id="focus-controls">
            <button type="button" id="focus-prev" class="iconbtn" title="previous (k)">&larr; prev</button>
            <button type="button" id="focus-skip" class="iconbtn" title="skip: send to the back of the queue (s)">skip</button>
            <button type="button" id="focus-next" class="iconbtn" title="next (j)">next &rarr;</button>
          </span>
          <button type="button" id="kb-toggle" class="iconbtn" title="keyboard shortcuts (?)">?</button>
        </div>
        <div id="kbhelp" style="display:none">
          <kbd>j</kbd>/<kbd>&rarr;</kbd> next · <kbd>k</kbd>/<kbd>&larr;</kbd> previous · <kbd>s</kbd> skip (to back of queue) ·
          <kbd>r</kbd> or <kbd>/</kbd> focus reply · <kbd>Enter</kbd> send &amp; advance · <kbd>Esc</kbd> leave the reply box ·
          <kbd>l</kbd> focus/list view · <kbd>n</kbd> toggle needs-input filter · <kbd>[</kbd> collapse/expand tasks panel · <kbd>?</kbd> this help
        </div>
        <div id="threadhead" style="display:none">
          <span id="thread-title" data-testid="thread-title"></span>
          <label class="toggle"><input type="checkbox" id="show-internal"> show internal</label>
        </div>
        <div id="chat">
          <div id="chatlog"></div>
          <div class="typing" id="typing" style="display:none">the planner is thinking…</div>
          <form id="chatform">
            <textarea id="chat-input" placeholder="select a task to reply…" rows="1"></textarea>
            <button type="submit" id="chat-send">send</button>
          </form>
        </div>
      </section>
      <section id="taskpane" class="pane">
        <div class="tp-head">
          <h2>tasks</h2>
          <button type="button" id="tp-toggle" class="iconbtn" title="collapse / expand the tasks panel ([)" aria-expanded="true">&#9656;</button>
        </div>
        <span id="rail-badge"></span>
        <div class="tasktools">
          <input id="task-search" type="search" placeholder="search title, id or date (YYYY-MM-DD)">
          <label class="toggle"><input type="checkbox" id="only-active" checked> only active</label>
          <label class="toggle"><input type="checkbox" id="needs-input"> needs input</label>
        </div>
        <div id="tasklist"></div>
      </section>
    </div>
  </div>
  <div id="tableview" style="display:none">
    <div id="createpanel" style="display:none">
      <form class="panel" id="createjob">
        <label>task</label>
        <textarea id="job-task" placeholder="what should the worker do?"></textarea>
        <div class="row">
          <div><label>requires (comma-separated tag names)</label><input id="job-requires" placeholder="os:linux, arch:amd64, tools:git"></div>
          <div><label>tier</label><select id="job-tier"><option value="">flash — GLM 5.3 Flash (cheapest, default)</option><option value="default">default — GLM 5.3 Flash, max thinking (same low price)</option><option value="hardest">hardest — GLM 5.3 (full model)</option></select></div>
          <div><label>timeout_s</label><input id="job-timeout" type="number" min="1" placeholder="300"></div>
          <div><label>priority 1-9</label><input id="job-priority" type="number" min="1" max="9" placeholder="5"></div>
        </div>
        <div class="row">
          <div><label>schedule (cron, optional)</label><input id="job-cron" placeholder="0 3 * * *"></div>
          <div><label>result schema (JSON, optional)</label><input id="job-schema" placeholder='{"type":"object"}'></div>
          <div><label>foreman (optional pin)</label><input id="job-foreman" placeholder="videochat or foreman:videochat"></div>
        </div>
        <button type="submit">create job</button>
        <span class="result-note" id="job-note"></span>
      </form>
    </div>
    <div class="toolbar">
      <span class="count" id="rowcount"></span>
      <select id="state-filter" style="display:none;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;font:12px var(--mono);padding:3px 6px">
        <option value="">all states</option>
        <option>held</option><option>pending</option><option>dispatched</option><option>running</option>
        <option>done</option><option>failed</option><option>timed_out</option><option>dead</option>
        <option>cancelled</option><option>superseded</option>
      </select>
      <span style="margin-left:auto" id="refreshed"></span>
    </div>
    <div id="list"></div>
    <div id="detail" style="display:none"></div>
  </div>
</main>
<script>
"use strict";
let selectedForeman = null, selectedInbox = null, selectedJob = null;
let tab = "chat";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function rel(ts) {
  if (!ts) return "-";
  const s = (Date.now() - Date.parse(ts)) / 1000;
  if (s < 0) return "just now";
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " -> HTTP " + r.status);
  return r.json();
}
async function postJSON(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((data.error && data.error.message) || ("HTTP " + r.status));
  return data;
}

function parseCaps(raw) {
  if (!raw) return {};
  if (typeof raw === "object") return raw;
  try { return JSON.parse(raw) || {}; } catch { return {}; }
}

function table(headers, rows) {
  if (!rows || rows.length === 0) {
    return '<table><thead><tr>' + headers.map(h => "<th>"+h+"</th>").join("") +
      '</tr></thead><tbody><tr><td class="empty" colspan="'+headers.length+'">nothing yet</td></tr></tbody></table>';
  }
  return '<table><thead><tr>' + headers.map(h => "<th>"+h+"</th>").join("") +
    "</tr></thead><tbody>" + rows.join("") + "</tbody></table>";
}

/* ---------- tasks / alerts (inbox redesign v1: I3-I5) ---------- */

const st = {
  tasks: [], alerts: [], selected: null, thread: null, // thread = {task, messages}
  onlyActive: true, q: "", showInternal: false,
  needsInput: false,
  mode: "focus",          // "focus" (default on every load) | "list"
  queue: [], focusId: null, // triage queue: ids awaiting the operator, on-screen order
  panelCollapsed: false,
  tasksAvailable: true,   // false once /v1/tasks 404s -> legacy single-log view
  alertsAvailable: true,  // false once /v1/alerts 404s
};
let sending = false;

function api404(e) { return e && e.status === 404; }
async function getJ(url) {
  const r = await fetch(url);
  if (!r.ok) { const e = new Error(url + " -> HTTP " + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function postJ(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error((data.error && (data.error.message || data.error)) || ("HTTP " + r.status));
    e.status = r.status; e.code = typeof data.error === "string" ? data.error : (data.error && data.error.code);
    throw e;
  }
  return data;
}

async function patchJ(url, body) {
  const r = await fetch(url, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error((data.error && (data.error.message || data.error)) || ("HTTP " + r.status));
    e.status = r.status;
    throw e;
  }
  return data;
}

// The API returns payloads as parsed JSON objects (json.RawMessage marshals
// inline), not strings - parse only when a string somehow arrives.
function payloadObj(env) {
  if (typeof env.payload === "string") {
    try { return JSON.parse(env.payload); } catch { return {}; }
  }
  return env.payload || {};
}
function chatPayloadText(env) {
  const p = payloadObj(env);
  return p.text || p.summary || "";
}

// renderMarkdown renders a chat text to safe HTML: HTML is escaped FIRST,
// then a conservative markdown subset transforms the escaped text (spec
// §9.5 chat bubbles). Supported: fenced ``` blocks, `inline code`,
// **bold**, *italic*, [links](http…) limited to http/https, #..###
// headings, -/* lists, blank-line paragraphs, single newlines as breaks.
// Everything else stays literal text - no raw HTML ever passes through.
function renderMarkdown(src) {
  const escd = esc(src);
  const blocks = [];
  let rest = escd.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.length;
    blocks.push('<pre><code>' + code.replace(/\n$/, "") + "</code></pre>");
    return "\x00block" + i + "\x00";
  });
  rest = rest
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>");
  rest = rest.replace(/(?:^|\n)((?:[-*] [^\n]*(?:\n|$))+)/g, (m, list) => {
    const lis = list.trim().split("\n").map(l => "<li>" + l.replace(/^[-*] /, "") + "</li>").join("");
    return "\n<ul>" + lis + "</ul>\n";
  });
  const html = rest.split(/\n{2,}/).map(par => {
    const t = par.trim();
    if (t === "") return "";
    if (/^(\x00block\d+\x00|<h\d>|<ul>|<pre>)/.test(t)) return t;
    return "<p>" + t.replace(/\n/g, "<br>") + "</p>";
  }).join("");
  return html.replace(/\x00block(\d+)\x00/g, (_, i) => blocks[+i]);
}

// isInternalEnv mirrors tasks.IsInternal: only chat.message and brain.reply
// are operator-visible. The server's "internal" flag wins when present.
function isInternalEnv(env) {
  if (typeof env.internal === "boolean") return env.internal;
  return env.type !== "chat.message" && env.type !== "brain.reply";
}

function bubble(env) {
  const text = chatPayloadText(env);
  const md = (t) => '<div class="md">' + (t ? renderMarkdown(t) : "") + "</div>";
  if (env.from === "human:operator" || env.type === "chat.message") {
    return '<div class="bubble human"><span class="who">you · ' + esc(rel(env.ts)) + '</span>' + md(text) + "</div>";
  }
  if (env.type === "brain.reply") {
    return '<div class="bubble brain"><span class="who">planner · ' + esc(rel(env.ts)) + '</span>' + md(text) + "</div>";
  }
  if (env.type === "notify.job") {
    const p = payloadObj(env);
    return '<div class="bubble notify"><span class="who">job ' + esc(p.job_id || env.job_id || "?") + " → " +
      '<span class="state st-' + esc(p.state || "") + '">' + esc(p.state || "?") + "</span> · " + esc(rel(env.ts)) + "</span>" +
      (p.foreman_id ? "foreman " + esc(p.foreman_id) + " · " : "") +
      (p.summary ? "summary: " + esc(p.summary) + " · " : "") +
      (p.over_budget ? '<span style="color:var(--warn)">OVER BUDGET</span> · ' : "") +
      (p.last_error ? '<span style="color:var(--bad)">error: ' + esc(p.last_error) + "</span>" : "") +
      (p.job_id ? ' · <a href="/v1/jobs/' + encodeURIComponent(p.job_id) + '" target="_blank">details</a>' : "") +
      "</div>";
  }
  if (env.type === "notify.pending") {
    const p = payloadObj(env);
    return '<div class="bubble notify"><span class="who">job ' + esc(p.job_id || "?") + " pending " +
      esc(String(p.pending_minutes ?? "?")) + "m · " + esc(rel(env.ts)) + "</span>" +
      (Array.isArray(p.requires) && p.requires.length ? " · requires: " + esc(p.requires.join(", ")) : "") +
      (p.reason ? '<div><span style="color:var(--warn)">' + esc(p.reason) + "</span>" +
        ' · <a href="/v1/jobs/' + encodeURIComponent(p.job_id || "") + '" target="_blank">details</a></div>' : "") +
      "</div>";
  }
  return '<div class="bubble notify"><span class="who">' + esc(env.type) + " from " + esc(env.from) + " · " + esc(rel(env.ts)) + "</span>" +
    esc(JSON.stringify(env.payload ?? null)) + "</div>";
}

function prioBadge(p) { return '<span class="prio p' + (p <= 3 ? p : "n") + '">P' + esc(p) + "</span>"; }

/* ----- alerts (left pane) ----- */

async function loadAlerts() {
  if (!st.alertsAvailable) return;
  try { st.alerts = (await getJ("/v1/alerts")).alerts || []; }
  catch (e) {
    if (api404(e)) { st.alertsAvailable = false; st.alerts = []; }
    else { $("alerts").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }
  }
  renderAlerts();
}

function renderAlerts() {
  const box = $("alerts");
  if (!st.alertsAvailable) { box.innerHTML = '<div class="empty">alerts not available on this factory yet</div>'; return; }
  $("alert-count").textContent = st.alerts.length ? String(st.alerts.length) : "";
  if (!st.alerts.length) { box.innerHTML = '<div class="empty">no open alerts</div>'; return; }
  box.innerHTML = st.alerts.map(a =>
    '<div class="alert" data-id="' + esc(a.id) + '">' +
    '<div class="ahead">' + prioBadge(a.priority) + ' <span class="atitle">' + esc(a.title) + "</span></div>" +
    (a.body ? '<div class="abody">' + esc(a.body) + "</div>" : "") +
    '<div class="ameta">' + esc(a.source || "") + " · " + esc(rel(a.created_at)) +
    (a.expires_at ? " · expires " + esc(rel(a.expires_at).replace(" ago", "")) : "") + "</div>" +
    '<div class="aactions"><button class="ack" data-id="' + esc(a.id) + '">ack</button> ' +
    '<button class="replytoggle" data-id="' + esc(a.id) + '">reply</button></div>' +
    '<form class="areply" data-id="' + esc(a.id) + '" style="display:none">' +
    '<textarea placeholder="reply (opens a task)" rows="2"></textarea><button type="submit">send</button></form>' +
    '<div class="err aerr" style="display:none"></div></div>').join("");
  for (const b of box.querySelectorAll("button.ack")) b.onclick = () => ackAlert(b.dataset.id);
  for (const b of box.querySelectorAll("button.replytoggle")) b.onclick = () => {
    const f = box.querySelector('form.areply[data-id="' + CSS.escape(b.dataset.id) + '"]');
    f.style.display = f.style.display === "none" ? "flex" : "none";
    if (f.style.display !== "none") f.querySelector("textarea").focus();
  };
  for (const f of box.querySelectorAll("form.areply")) f.onsubmit = (ev) => { ev.preventDefault(); replyAlert(f); };
}

function alertError(id, msg) {
  const el = $("alerts").querySelector('.alert[data-id="' + CSS.escape(id) + '"] .aerr');
  if (el) { el.textContent = msg; el.style.display = "block"; }
}

async function ackAlert(id) {
  try { await postJ("/v1/alerts/" + encodeURIComponent(id) + "/ack"); }
  catch (e) {
    // 409 already_terminal: someone else (or expiry) closed it - just refresh.
    if (e.status !== 409) { alertError(id, e.message); return; }
  }
  await loadAlerts();
}

async function replyAlert(form) {
  const id = form.dataset.id;
  const text = form.querySelector("textarea").value.trim();
  if (!text) return;
  try {
    const out = await postJ("/v1/alerts/" + encodeURIComponent(id) + "/reply", { text });
    await loadAlerts();
    await loadTasks();
    if (out.task_id) await selectTask(out.task_id);
  } catch (e) {
    if (e.status === 409) { await loadAlerts(); return; }
    alertError(id, e.message);
  }
}

/* ----- triage queue helpers (mirror internal/tasks/awaiting.go; ordering itself is server-side) ----- */

// mergeQueue keeps the on-screen queue stable: ids still waiting keep their
// place, answered ones drop out, newly waiting ones join at the end.
function mergeQueue(prev, fresh) {
  const waiting = new Set(fresh), seen = new Set(), out = [];
  for (const id of prev) if (waiting.has(id) && !seen.has(id)) { out.push(id); seen.add(id); }
  for (const id of fresh) if (!seen.has(id)) { out.push(id); seen.add(id); }
  return out;
}
// advance returns the id after current (wrapping), "" when nothing else waits;
// when current is not in the queue (answered and dropped) it is the head.
function advance(queue, current) {
  const i = queue.indexOf(current);
  if (i < 0) return queue.length ? queue[0] : "";
  for (let k = 1; k < queue.length; k++) { const id = queue[(i + k) % queue.length]; if (id !== current) return id; }
  return "";
}
window.__queue = { mergeQueue, advance };

async function loadQueue() {
  if (!st.tasksAvailable) return;
  try {
    const fresh = ((await getJ("/v1/tasks?status=open&awaiting=operator&limit=500")).tasks || []).map(t => t.id);
    st.queue = mergeQueue(st.queue, fresh);
  } catch (e) { if (api404(e)) st.tasksAvailable = false; return; }
  if (st.mode === "focus" && !st.queue.includes(st.focusId)) {
    // the focused task was answered elsewhere / closed: move to the head.
    st.focusId = st.queue.length ? st.queue[0] : null;
    st.selected = st.focusId; st.thread = null;
  }
  renderFocusBar();
}

function setFocus(id) {
  st.focusId = id || null; st.selected = st.focusId; st.thread = null;
  renderFocusBar(); renderTasks();
  return loadThread();
}
function focusStep(delta) {
  if (!st.queue.length) return;
  const i = st.queue.indexOf(st.focusId);
  return setFocus(st.queue[((i < 0 ? 0 : i + delta) % st.queue.length + st.queue.length) % st.queue.length]);
}
function focusSkip() {
  if (st.queue.length < 2) return;
  const cur = st.focusId, nxt = advance(st.queue, cur);
  st.queue = st.queue.filter(id => id !== cur).concat([cur]);
  return setFocus(nxt);
}

function setMode(m) {
  st.mode = m;
  if (m === "focus") { st.focusId = null; st.selected = null; st.thread = null; }
  renderFocusBar();
  return loadChat();
}

function renderFocusBar() {
  const n = st.queue.length, focus = st.mode === "focus";
  $("waiting-count").textContent = n + " waiting";
  $("rail-badge").textContent = n ? n + " waiting" : "";
  $("modetoggle").textContent = focus ? "◉ focus mode · switch to list" : "☰ list view · switch to focus";
  $("modetoggle").classList.toggle("on", focus);
  $("focus-controls").style.display = focus ? "" : "none";
  $("focus-prev").disabled = $("focus-next").disabled = n < 2;
  $("focus-skip").disabled = n < 2;
  $("kbhelp").style.display = st.kbHelp ? "block" : "none";
}

/* ----- tasks (right pane) ----- */

async function loadTasks() {
  if (!st.tasksAvailable) return;
  const qs = "?status=" + (st.onlyActive ? "open" : "all") + "&limit=100" + (st.q ? "&q=" + encodeURIComponent(st.q) : "") +
    (st.needsInput ? "&awaiting=operator" : "");
  try { st.tasks = (await getJ("/v1/tasks" + qs)).tasks || []; }
  catch (e) {
    if (api404(e)) { st.tasksAvailable = false; st.tasks = []; renderTasks(); await loadLegacy(); return; }
    $("tasklist").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return;
  }
  renderTasks();
}

function renderTasks() {
  const box = $("tasklist");
  if (!st.tasksAvailable) { box.innerHTML = '<div class="empty">tasks not available on this factory yet - showing the legacy log</div>'; return; }
  if (!st.tasks.length) {
    box.innerHTML = '<div class="empty">' + (st.q ? "no matching tasks" : st.needsInput ? "nothing needs your input" : st.onlyActive ? "no active tasks" : "no tasks yet") + "</div>"; return;
  }
  box.innerHTML = st.tasks.map(t =>
    '<div class="task' + (t.id === st.selected ? " selected" : "") + (t.status === "closed" ? " closed" : "") + '" data-id="' + esc(t.id) + '">' +
    '<div class="thead">' + prioBadge(t.priority) + ' <span class="ttitle">' + esc(t.title) + "</span>" +
    (t.awaiting === "operator" ? '<span class="needs" title="waiting on you">● needs input</span>' : "") + "</div>" +
    (t.preview ? '<div class="tprev">' + esc(t.preview) + "</div>" : "") +
    '<div class="tmeta">' + esc(t.status) + " · " + esc(rel(t.last_activity_at || t.updated_at)) + " · " + esc(t.id) + "</div></div>").join("");
  for (const el of box.querySelectorAll(".task")) el.onclick = () => {
    // picking a task from the list opens it in the list view.
    if (st.mode === "focus") { st.mode = "list"; renderFocusBar(); }
    selectTask(el.dataset.id);
  };
}

/* ----- thread (center pane) ----- */

async function selectTask(id) {
  st.selected = id; st.thread = null;
  renderTasks();
  await loadThread();
}

async function loadThread() {
  if (!st.tasksAvailable) return;
  if (!st.selected && st.mode === "focus" && st.focusId) st.selected = st.focusId;
  if (!st.selected) { renderThread(); return; }
  try { st.thread = await getJ("/v1/tasks/" + encodeURIComponent(st.selected) + (st.showInternal ? "?internal=1" : "")); }
  catch (e) {
    if (e.status === 404) { st.selected = null; st.thread = null; renderTasks(); renderThread(); return; }
    $("chatlog").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return;
  }
  renderThread();
}

function renderThread() {
  const log = $("chatlog");
  const head = $("threadhead");
  if (!st.tasksAvailable) return;
  $("chatform").style.display = "";
  if (!st.thread && st.mode === "focus" && !st.focusId) {
    head.style.display = "none";
    log.innerHTML = '<div id="focus-empty" class="empty"><div class="big">Nothing needs your input</div>' +
      "all caught up - tasks that need a reply will appear here</div>";
    $("typing").style.display = "none";
    $("chatform").style.display = "none";
    return;
  }
  if (!st.thread) {
    head.style.display = "none";
    log.innerHTML = '<div class="empty">select a task, or start a new one above</div>';
    $("typing").style.display = "none";
    $("chat-input").placeholder = "select a task to reply…";
    return;
  }
  const t = st.thread.task, msgs = st.thread.messages || [];
  head.style.display = "flex";
  renderTitle(t);
  $("show-internal").checked = st.showInternal;
  const el = log;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  const shown = st.showInternal ? msgs : msgs.filter(m => !isInternalEnv(m));
  log.innerHTML = shown.length ? shown.map(m => (isInternalEnv(m) ? '<div class="internal">' : "") + bubble(m) + (isInternalEnv(m) ? "</div>" : "")).join("")
    : '<div class="empty">no messages in this task yet</div>';
  if (atBottom) log.scrollTop = log.scrollHeight;
  const last = shown[shown.length - 1];
  $("typing").style.display = last && last.from === "human:operator" && t.status === "open" ? "block" : "none";
  $("chat-input").placeholder = t.status === "closed" ? "reply to reopen this task…" : "reply in this task…";
}

/* ----- in-place task rename (PATCH /v1/tasks/{id}) -----
   Click the title or the pencil (or focus it and press Enter/Space) to edit.
   Enter or blur saves, Escape cancels. A failure shows an inline error and
   reverts to the stored title. While editing, live refreshes do not touch the
   header, so a typed-in title is never clobbered by an SSE-driven re-render. */

let titleEdit = null; // {id} while the title input is open

function renderTitle(t) {
  if (titleEdit) {
    if (titleEdit.id === t.id) return; // keep the open editor
    titleEdit = null;                  // switched task: drop it
  }
  const box = $("thread-title");
  box.innerHTML = prioBadge(t.priority) + ' <span class="ttl" role="button" tabindex="0" title="Rename task" aria-label="Task title: ' +
    esc(t.title) + '. Activate to rename" id="title-text">' + esc(t.title) + "</span>" +
    '<button type="button" class="editbtn" id="title-edit" title="Rename task" aria-label="Rename task">&#9998;</button>' +
    ' <span class="badge">' + esc(t.status) + '</span><span class="titleerr" id="title-err" role="alert"></span>';
  if (titleErr && titleErr.id === t.id) $("title-err").textContent = titleErr.msg; // sticks until the next edit
  const go = () => startTitleEdit();
  $("title-text").onclick = go;
  $("title-text").onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } };
  $("title-edit").onclick = go;
}

let titleErr = null; // {id, msg}: last failed rename, shown inline

function startTitleEdit() {
  if (titleEdit || !st.thread) return;
  const t = st.thread.task;
  titleEdit = { id: t.id };
  titleErr = null;
  const box = $("thread-title");
  box.innerHTML = prioBadge(t.priority) +
    ' <input type="text" class="titleedit" id="title-input" maxlength="200" aria-label="Task title" value="' + esc(t.title) + '">';
  const inp = $("title-input");
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const next = inp.value.trim();
    if (!save || next === t.title) { titleEdit = null; renderTitle(st.thread.task); $("title-text").focus(); return; }
    inp.disabled = true;
    try {
      const out = await patchJ("/v1/tasks/" + encodeURIComponent(t.id), { title: next });
      titleEdit = null;
      if (st.thread && st.thread.task.id === t.id) st.thread.task = Object.assign(st.thread.task, out.task);
      renderTitle(out.task);
      const ti = st.tasks.find(x => x.id === t.id); if (ti) ti.title = out.task.title;
      renderTasks();
      $("title-text").focus();
    } catch (e) {
      titleEdit = null;
      titleErr = { id: t.id, msg: "rename failed: " + e.message };
      renderTitle(st.thread.task); // revert to the stored title
      $("title-text").focus();
    }
  };
  inp.onkeydown = (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
    else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
  };
  inp.onblur = () => finish(true);
  inp.focus(); inp.select();
}

$("show-internal").onchange = async () => { st.showInternal = $("show-internal").checked; await loadThread(); };

/* ----- legacy fallback (no /v1/tasks): the old single planner:main log ----- */

async function loadLegacy() {
  let envs;
  try { envs = await getJ("/v1/inboxes/planner:main/recent?limit=100"); }
  catch (e) { $("chatlog").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }
  envs = (envs || []).filter(e => !isInternalEnv(e) || e.type === "notify.pending");
  const el = $("chatlog");
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  $("threadhead").style.display = "none";
  el.innerHTML = envs.length ? envs.map(bubble).join("") : '<div class="empty">no messages yet — say something to the factory</div>';
  if (atBottom) el.scrollTop = el.scrollHeight;
  const last = envs[envs.length - 1];
  $("typing").style.display = last && last.from === "human:operator" ? "block" : "none";
}

/* ----- composers ----- */

async function sendText(text, taskID) {
  if (sending || !text) return null;
  sending = true;
  try {
    // POST /v1/tasks is the "new task" alias; fall back to /v1/chat if absent.
    if (!taskID && st.tasksAvailable) {
      try { return await postJ("/v1/tasks", { text }); }
      catch (e) { if (e.status !== 404 && e.status !== 405) throw e; }
    }
    return await postJ("/v1/chat", taskID ? { text, task_id: taskID } : { text });
  } finally { sending = false; }
}

$("newtaskform").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("newtask-input").value.trim();
  if (!text) return;
  $("newtask-send").disabled = true;
  try {
    const out = await sendText(text, null);
    $("newtask-input").value = "";
    if (st.tasksAvailable) { await loadTasks(); if (out && out.task_id) await selectTask(out.task_id); }
    else await loadLegacy();
  } catch (e) {
    $("chatlog").insertAdjacentHTML("beforeend", '<div class="err">' + esc(e.message) + "</div>");
  } finally { $("newtask-send").disabled = false; }
};

$("chatform").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("chat-input").value.trim();
  if (!text) return;
  if (st.tasksAvailable && !st.selected) return;
  $("chat-send").disabled = true;
  try {
    const replied = st.selected;
    await sendText(text, st.tasksAvailable ? st.selected : null);
    $("chat-input").value = "";
    if (st.tasksAvailable && st.mode === "focus") {
      // advance to the next waiting task (computed from the queue as it was
      // when the reply was sent); loadQueue drops the answered one.
      const nxt = advance(st.queue, replied);
      st.focusId = nxt || null; st.selected = st.focusId; st.thread = null;
      await loadQueue();
      if (!st.queue.includes(st.focusId)) { st.focusId = st.queue[0] || null; st.selected = st.focusId; }
      await loadThread(); await loadTasks();
    } else if (st.tasksAvailable) { await loadThread(); await loadTasks(); await loadQueue(); } else await loadLegacy();
  } catch (e) {
    $("chatlog").insertAdjacentHTML("beforeend", '<div class="err">' + esc(e.message) + "</div>");
  } finally { $("chat-send").disabled = false; }
};

/* keyboard shortcuts (documented in #kbhelp, toggled by ?) */
document.addEventListener("keydown", (ev) => {
  if (tab !== "chat" || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const typing = ["TEXTAREA", "INPUT", "SELECT"].includes(ev.target.tagName);
  if (typing) { if (ev.key === "Escape") ev.target.blur(); return; }
  const focus = st.mode === "focus";
  switch (ev.key) {
    case "j": case "ArrowRight": if (focus) focusStep(1); else return; break;
    case "k": case "ArrowLeft": if (focus) focusStep(-1); else return; break;
    case "s": if (focus) focusSkip(); else return; break;
    case "r": case "/": $("chat-input").focus(); break;
    case "l": setMode(focus ? "list" : "focus"); break;
    case "n": $("needs-input").checked = st.needsInput = !st.needsInput; loadTasks(); break;
    case "[": setPanelCollapsed(!st.panelCollapsed, true); break;
    case "?": st.kbHelp = !st.kbHelp; renderFocusBar(); break;
    default: return;
  }
  ev.preventDefault();
});

/* ----- live updates (I5): SSE on planner:main, polling as the safety net ----- */

let refreshTimer = null;
function scheduleRefresh() {
  if (refreshTimer) return;
  refreshTimer = setTimeout(() => { refreshTimer = null; if (tab === "chat") loadChat(); }, 300);
}
function connectStream() {
  if (typeof EventSource === "undefined") return;
  const es = new EventSource("/v1/inboxes/planner:main/stream");
  // Any message (persisted thread rows, synthetic task.changed /
  // alert.changed) is a "something changed" hint: debounce and refetch.
  es.addEventListener("message", scheduleRefresh);
  es.onerror = () => { /* EventSource reconnects by itself; polling covers the gap */ };
}

/* ---------- factory usage panel (read-only; GET /v1/usage) ---------- */

const USAGE_POLL_MS = 60000, USAGE_STALE_S = 300;
const USAGE_WINDOWS = [["five_hour", "5-hour"], ["seven_day", "weekly"]];
const USAGE_STATES = ["GREEN", "YELLOW", "ORANGE", "RED"];
let usageData = null, usageFetchedAt = 0, usageError = "";

const usageState = (s) => USAGE_STATES.includes(s) ? s : "UNKNOWN";
function fmtCountdown(ms) {
  if (ms <= 0) return "resetting…";
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
  return "in " + (d ? d + "d " + h + "h" : h ? h + "h " + (m % 60) + "m" : m + "m");
}
function fmtUTC(ts) { return ts ? new Date(ts).toISOString().slice(0, 16).replace("T", " ") + "Z" : "-"; }
function fmtAge(s) { return s == null ? "-" : s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" : Math.floor(s / 3600) + "h"; }
// Window is stale if the server says so, the reading is old, or we have no age.
function usageWinStale(w) { return !!w.stale || w.age_s == null || w.age_s > USAGE_STALE_S; }

// usageHTML renders the window rows from a /v1/usage payload; nowMs drives the
// countdown. Tolerates missing/null fields (older or empty snapshots).
function usageHTML(d, nowMs, fetchErr) {
  const wins = (d && d.windows) || {};
  let out = "";
  for (const [key, label] of USAGE_WINDOWS) {
    const w = wins[key];
    if (!w) { out += '<div class="uwin stale"><div class="urow"><b>' + label + '</b> no data</div></div>'; continue; }
    const st = usageState(w.state), stale = usageWinStale(w) || !!fetchErr;
    const pct = w.utilization_pct == null ? null : Math.max(0, Math.min(100, w.utilization_pct));
    out += '<div class="uwin' + (stale ? " stale" : "") + '" data-window="' + key + '">' +
      '<div class="urow"><b>' + label + '</b><span class="meter"><i class="' + st + '" style="width:' + (pct ?? 0) + '%"></i></span>' +
      "<span>" + (pct == null ? "?" : Math.round(pct * 10) / 10 + "%") + '</span><span class="badge ' + st + '">' + st + "</span></div>" +
      '<div class="udetail">resets ' + fmtUTC(w.resets_at) + (w.resets_at ? " (" + fmtCountdown(Date.parse(w.resets_at) - nowMs) + ")" : "") +
      " · pace " + (w.pace == null ? "-" : w.pace.toFixed(2) + "x") + " · " + esc(w.source || "-") + " · " + fmtAge(w.age_s) + " old" +
      (w.stale ? " · STALE" : "") + "</div></div>";
  }
  return out;
}
function usageSpendText(sp) {
  if (!sp) return "";
  const f = (k) => sp[k] ? "$" + Number(sp[k].cost_usd || 0).toFixed(2) + " / " + Number(sp[k].tokens || 0).toLocaleString() + " tok" : "-";
  return "factory spend — 5h: " + f("5h") + " · 7d: " + f("7d") + " · today: " + f("today");
}

function renderUsage() {
  const stale = !usageData || !!usageError || (usageData.windows && USAGE_WINDOWS.some(([k]) => usageData.windows[k] && usageWinStale(usageData.windows[k])));
  const overall = usageData ? usageState(usageData.state) : "UNKNOWN";
  $("u-overall").innerHTML = 'overall <span class="badge ' + overall + '">' + overall + "</span>";
  $("u-meta").textContent = usageFetchedAt ? "updated " + new Date(usageFetchedAt).toISOString().slice(11, 19) + "Z" : "";
  $("u-note").textContent = usageError ? "unavailable: " + usageError + (usageData ? " (showing last data)" : "")
    : stale && usageData ? "stale data" : "";
  $("u-wins").innerHTML = usageData ? usageHTML(usageData, Date.now(), usageError) : '<div class="uwin stale">no usage data</div>';
  $("u-spend").textContent = usageData ? usageSpendText(usageData.factory_spend) : "";
  renderGate();
}
/* ---------- S6: gate status, held jobs, pause banner, override controls, alerts ---------- */

const GATE_LEVELS = ["GREEN", "YELLOW", "ORANGE", "RED", "PAUSED"];
const GATE_ALERT_SOURCE = "factory:throttle", GATE_ALERT_MAX = 4, HELD_MAX = 8;
const OVERRIDE_PRESETS = [["10m", 600], ["1h", 3600]]; // seconds; "until reset" is computed
let heldJobs = null, heldError = "", gateAlerts = null, gateAlertsError = "", ctlBusy = false, ctlError = "";

const gateLevel = (g) => g && (g.paused ? "PAUSED" : GATE_LEVELS.includes(g.level) ? g.level : "UNKNOWN") || "UNKNOWN";
const pauseWindowLabel = (w) => w === "5h" ? "5-hour" : w === "7d" ? "weekly" : "usage";

function pauseBannerHTML(g, nowMs) {
  if (!g || !g.paused) return "";
  const until = g.paused_until ? Date.parse(g.paused_until) : NaN;
  const when = isNaN(until) ? "at an unknown time" : fmtUTC(g.paused_until) + " (" + (until <= nowMs ? "resuming…" : fmtCountdown(until - nowMs)) + ")";
  return "Paused: " + esc(pauseWindowLabel(g.paused_window)) + " limit reached. Resumes " + when +
    (g.pause_reason ? '<span class="upreason">' + esc(g.pause_reason) + "</span>" : "") +
    (g.mode === "off" ? '<span class="upreason">Throttle override is ON: dispatch is not being held.</span>' : "");
}

function gateHTML(g, nowMs) {
  if (!g) return "gate: n/a";
  const lvl = gateLevel(g), off = g.mode === "off";
  let out = "gate <b>mode</b> " + '<span class="badge ' + (off ? "OFF" : "AUTO") + '">' + (off ? "OFF" : "AUTO") + "</span>";
  if (off && g.mode_source === "override" && g.override_until) {
    const u = Date.parse(g.override_until);
    out += " override until " + fmtUTC(g.override_until) + (isNaN(u) ? "" : " (" + (u <= nowMs ? "expiring…" : fmtCountdown(u - nowMs)) + ")");
  } else if (off && g.mode_source === "env") out += " (FACTORY_THROTTLE=off)";
  out += " · <b>level</b> " + '<span class="badge ' + lvl + '">' + lvl + "</span>";
  if (g.fail_open) out += ' <span class="ufail" title="no fresh live usage reading: the gate admits everything">FAIL-OPEN</span>';
  if (g.summary) out += " · " + esc(g.summary);
  out += " · held " + (g.held == null ? "-" : Number(g.held));
  return out;
}

// overrideUntilReset picks the reset to run the override to: the pause end when
// paused, else the reset of the worst-state window. null when unknown/past.
function overrideUntilReset(d, nowMs) {
  const g = d && d.gate;
  let ts = g && g.paused && g.paused_until ? g.paused_until : null;
  if (!ts) {
    let best = -1;
    for (const [k] of USAGE_WINDOWS) {
      const w = d && d.windows && d.windows[k];
      if (!w || !w.resets_at) continue;
      const score = USAGE_STATES.indexOf(w.state) * 1000 + (w.utilization_pct || 0);
      if (score > best) { best = score; ts = w.resets_at; }
    }
  }
  const t = ts ? Date.parse(ts) : NaN;
  return !isNaN(t) && t > nowMs ? new Date(t).toISOString() : null;
}

function controlsHTML(d, nowMs, unavailable) {
  const g = d && d.gate;
  if (!g) return "";
  const dis = unavailable || ctlBusy ? " disabled" : "";
  const ur = overrideUntilReset(d, nowMs);
  const overridden = g.mode === "off" && g.mode_source === "override";
  let out = "override: " + OVERRIDE_PRESETS.map(([l, sec]) =>
    '<button class="uoff" data-secs="' + sec + '" data-label="' + l + '"' + dis + ">Throttle off for " + l + "</button>").join("") +
    '<button class="uoff" data-reset="' + esc(ur || "") + '" data-label="until reset"' + (dis || (ur ? "" : " disabled")) +
    (ur ? "" : ' title="no known reset time"') + ">Throttle off until reset</button>" +
    '<button class="uauto"' + (dis || (g.mode === "off" || overridden ? "" : " disabled")) + ">Back to auto</button>";
  if (ctlBusy) out += " working…";
  if (ctlError) out += ' <span class="uerr">' + esc(ctlError) + "</span>";
  return out;
}

function heldHTML(g, jobs, err) {
  const n = g && g.held != null ? Number(g.held) : (jobs ? jobs.length : 0);
  let out = "<b>held jobs</b> " + n;
  if (err) out += ' <span class="uerr unote">list unavailable: ' + esc(err) + "</span>";
  if (!n && !err) return out + " — none";
  if (!jobs || !jobs.length) return out;
  out += "<table><tbody>" + jobs.slice(0, HELD_MAX).map(j => {
    const title = String((j.spec && j.spec.task) || "").split("\n")[0].slice(0, 80);
    return '<tr class="uheldrow" tabindex="0" data-id="' + esc(j.id) + '" title="open job detail"><td>' + esc(j.id) + "</td><td>" + esc(title || "-") +
      "</td><td>" + esc(j.held_reason || "-") + "</td><td>" + esc(rel(j.updated_at || j.created_at)) + "</td></tr>";
  }).join("") + "</tbody></table>" + (jobs.length > HELD_MAX ? "+" + (jobs.length - HELD_MAX) + " more (Jobs tab, state=held)" : "");
  return out;
}

function gateAlertsHTML(list, err) {
  let out = "<b>gate alerts</b>";
  if (err) return out + ' <span class="unote">unavailable: ' + esc(err) + "</span>";
  if (!list || !list.length) return out + " — none open";
  return out + list.slice(0, GATE_ALERT_MAX).map(a =>
    '<div class="ualert" data-id="' + esc(a.id) + '">' + prioBadge(a.priority) + " " +
    '<span class="' + (a.priority <= 1 ? "ucrit" : "") + '">' + esc(a.title) + "</span> · " + esc(rel(a.created_at)) + "</div>").join("");
}

function renderGate() {
  const d = usageData, g = d && d.gate, now = Date.now(), unavailable = !!usageError || !d;
  $("usagepanel").classList.toggle("unavail", unavailable);
  const banner = pauseBannerHTML(g, now);
  $("u-pause").style.display = banner ? "block" : "none";
  $("u-pause").innerHTML = banner;
  $("u-gate").innerHTML = d ? gateHTML(g, now) : "";
  $("u-ctl").innerHTML = d ? controlsHTML(d, now, unavailable) : "";
  $("u-held").innerHTML = g ? heldHTML(g, heldJobs, heldError) : "";
  $("u-alerts").innerHTML = d ? gateAlertsHTML(gateAlerts, gateAlertsError) : "";
  for (const b of $("u-ctl").querySelectorAll("button.uoff")) b.onclick = () => overrideOff(b.dataset);
  const auto = $("u-ctl").querySelector("button.uauto");
  if (auto) auto.onclick = () => overrideAuto();
  for (const tr of $("u-held").querySelectorAll("tr.uheldrow")) {
    tr.onclick = () => openJob(tr.dataset.id);
    tr.onkeydown = (ev) => { if (ev.key === "Enter") openJob(tr.dataset.id); };
  }
}

async function openJob(id) {
  setTab("jobs"); selectedJob = id;
  await renderJobDetail(id);
  if ($("detail").scrollIntoView) $("detail").scrollIntoView({ block: "nearest" });
}

async function postThrottle(body) {
  ctlBusy = true; ctlError = ""; renderGate();
  try {
    const gv = await postJSON("/v1/throttle", body);
    if (usageData) usageData.gate = gv;
  } catch (e) { ctlError = "throttle change failed: " + e.message; }
  ctlBusy = false;
  await loadUsage(); // re-reads gate + held + alerts; keeps ctlError
}
async function overrideOff(ds) {
  let until, label = ds.label;
  if (ds.secs) until = new Date(Date.now() + Number(ds.secs) * 1000).toISOString();
  else if (ds.reset) until = ds.reset;
  else { ctlError = "no known reset time"; renderGate(); return; }
  if (!window.confirm("Turn the usage throttle OFF for " + label + " (until " + fmtUTC(until) + ")?\n\n" +
    "Jobs will dispatch even when the usage limit is nearly or fully used" +
    (usageData && usageData.gate && usageData.gate.paused ? ", including while PAUSED" : "") + ". Held jobs will be released.")) return;
  await postThrottle({ mode: "off", until: until.replace(/\.\d+Z$/, "Z") });
}
async function overrideAuto() { await postThrottle({ mode: "auto" }); }

async function loadHeld() {
  const g = usageData && usageData.gate;
  if (!g || !g.held) { heldJobs = []; heldError = ""; return; }
  try { heldJobs = (await getJSON("/v1/jobs?state=held&limit=50")) || []; heldError = ""; }
  catch (e) { heldError = e.message; }
}
async function loadGateAlerts() {
  try {
    const all = (await getJSON("/v1/alerts")).alerts || [];
    gateAlerts = all.filter(a => a.source === GATE_ALERT_SOURCE);
    gateAlertsError = "";
  } catch (e) { gateAlertsError = e.message; }
}

async function loadUsage() {
  try { usageData = await getJSON("/v1/usage"); usageFetchedAt = Date.now(); usageError = ""; }
  catch (e) { usageError = e.message; }
  renderUsage();
  if (!usageError) { await Promise.all([loadHeld(), loadGateAlerts()]); renderUsage(); }
}

/* ---------- tabs & tick ---------- */

const loaders = { chat: loadChat, foremen: loadForemen, jobs: loadJobs, inboxes: loadInboxes };
function setTab(t) {
  tab = t;
  for (const id of ["chat", "foremen", "jobs", "inboxes"]) {
    $("tab-" + id).classList.toggle("active", id === t);
  }
  $("chatview").style.display = t === "chat" ? "block" : "none";
  document.querySelector("main").classList.toggle("wide", t === "chat");
  $("tableview").style.display = t === "chat" ? "none" : "block";
  $("createpanel").style.display = t === "jobs" ? "block" : "none";
  $("state-filter").style.display = t === "jobs" ? "inline" : "none";
  selectedForeman = selectedInbox = selectedJob = null;
  $("detail").style.display = "none";
  loaders[t]();
}
for (const id of ["chat", "foremen", "jobs", "inboxes"]) {
  $("tab-" + id).onclick = () => setTab(id);
}
$("state-filter").onchange = () => loadJobs();

(async () => {
  $("adv").textContent = location.host;
  document.querySelector("main").classList.add("wide");
  loadUsage();
  setInterval(loadUsage, USAGE_POLL_MS);
  setInterval(renderUsage, 30000); // keep countdowns moving between polls
  await loadChat();
  connectStream();
  // SSE is the fast path; the slow poll is the safety net (and the only path
  // on older factories). Tables refresh slower (5s).
  setInterval(() => { if (tab === "chat") loadChat(); }, 10000);
  setInterval(() => { if (tab !== "chat") loaders[tab](); $("refreshed").textContent = "refreshed " + new Date().toLocaleTimeString(); }, 5000);
})();
</script>
